[project]
name = "duplexrag"
version = "1.0.0"
description = "DuplexRAG - streaming live RAG engine for full-duplex conversations (Samsung PRISM GenAI Hackathon 2026, Theme 4)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Team Pokermons (VITV)" }]
dependencies = [
    "numpy>=1.26,<3",
    "fastembed>=0.7,<0.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
submission = ["python-pptx>=1.0", "python-docx>=1.1", "matplotlib>=3.9"]
demo = ["playwright>=1.47"]

[project.scripts]
duplexrag = "duplexrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duplexrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
